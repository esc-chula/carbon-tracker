components:
  schemas:
    Activity:
      additionalProperties: false
      properties:
        name:
          type: string
        unit:
          type: string
        value:
          format: double
          type: number
      required:
        - name
        - value
        - unit
      type: object
    Attendee:
      additionalProperties: false
      properties:
        date:
          format: date-time
          type: string
        value:
          format: int64
          type: integer
      required:
        - date
        - value
      type: object
    Building:
      additionalProperties: false
      properties:
        end_time:
          format: date-time
          type: string
        facilities:
          items:
            type: string
          type:
            - array
            - "null"
        meter_value:
          format: double
          type: number
        name:
          type: string
        room:
          type: string
        start_time:
          format: date-time
          type: string
      required:
        - name
        - room
        - facilities
      type: object
    CarbonDetailGenericScope3WithTransportations:
      additionalProperties: false
      properties:
        scope1:
          $ref: "#/components/schemas/Scope1"
        scope2:
          $ref: "#/components/schemas/Scope2"
        scope3:
          $ref: "#/components/schemas/Scope3WithTransportations"
      required:
        - scope1
        - scope2
        - scope3
      type: object
    CarbonEmissionByOrganizationItem:
      additionalProperties: false
      properties:
        organization:
          type: string
        percent:
          format: double
          type: number
        total:
          format: double
          type: number
      required:
        - organization
        - total
        - percent
      type: object
    CarbonEmissionPerPerson:
      additionalProperties: false
      properties:
        scope1:
          format: double
          type: number
        scope2:
          format: double
          type: number
        scope3:
          format: double
          type: number
        total:
          format: double
          type: number
      required:
        - total
        - scope1
        - scope2
        - scope3
      type: object
    CarbonResult:
      additionalProperties: false
      properties:
        scope1:
          $ref: "#/components/schemas/Scope1Result"
        scope2:
          $ref: "#/components/schemas/Scope2Result"
        scope3:
          $ref: "#/components/schemas/Scope3Result"
      required:
        - scope1
        - scope2
        - scope3
      type: object
    CreateProjectResponseBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/CreateProjectResponseBody.json
          format: uri
          readOnly: true
          type: string
        project_id:
          type: string
      required:
        - project_id
      type: object
    Dashboard:
      additionalProperties: false
      properties:
        available_years:
          items:
            format: int64
            type: integer
          type:
            - array
            - "null"
        carbon_emission_by_organization:
          items:
            $ref: "#/components/schemas/CarbonEmissionByOrganizationItem"
          type:
            - array
            - "null"
        carbon_emission_per_person:

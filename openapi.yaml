  /projects/:id/calculate:
    get:
      description: |-
        Get carbon emission of a project in the current academic year.
        Authenticated users can view emission for their own projects (any status), or other users' projects that are not in draft status.
        Projects from a previous academic year are not accessible.
      operationId: get-projects-id-calculate
      parameters:
        - in: header
          name: Authorization
          schema:
            type: string
        - in: path
          name: id

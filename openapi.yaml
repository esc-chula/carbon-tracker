  /projects/:id/review:
    put:
      description: |+
        Allows an admin to review a project.

        Projects from a previous academic year are not accessible.

        - If all review fields pass, the project status is set to **approved**.
        - If any field fails, the project status is set to **rejected**.
        **Allowed status transitions**
        - pending -> approved
        - pending -> rejected
        - rejected -> rejected

        This endpoint will create a new review if one does not exist, or update the existing review (upsert behavior).

      operationId: put-projects-id-review
      parameters:
        - in: header
          name: Authorization
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewUpsertInput"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Review project
  /projects/:id/status:
    put:
      description: |-
        Update the status of a project.

        Projects from a previous academic year are not accessible.

        **Allowed status transitions for owner**
        - draft -> pending
        - rejected -> fixing
        - fixing -> pending

        **Allowed status transitions for admin**
        - approved -> pending
      operationId: put-projects-id-status
      parameters:
        - in: header
          name: Authorization
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectStatusRequestBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update project status

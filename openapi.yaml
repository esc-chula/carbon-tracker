info:
  title: carbon-tracker-api
  version: 1.0.0
openapi: 3.1.0
paths:
  /dashboard/:
    get:
      description: |-
        Retrieve the dashboard overview, including:
        - current_year: current academic year
        - available_years: academic years present on non-deleted projects (always includes current_year), ascending
        - Total project count for the selected year
        - Total carbon emissions grouped by organization, sorted by total carbon emission in descending order (If totals are equal, sort by organization name in ascending order)
        - Carbon emission per-person (scope 1–3)
        - Activity heatmap data

        Query param year selects the academic year for totals/heatmap. Defaults to current_year when omitted or 0.
      operationId: get-dashboard
      parameters:
        - description: Academic year for totals and heatmap. Defaults to current_year if omitted or 0.
          explode: false
          in: query
          name: year
          schema:
            description: Academic year for totals and heatmap. Defaults to current_year if omitted or 0.
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetDashboardResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get Dashboard
  /owners/me:
    get:
      description: Retrieve the owner details for the current user, based on the Authorization header.
      operationId: get-owners-me
      parameters:
        - in: header
          name: Authorization
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetOwnerResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get owner
  /owners/validate:
    post:
      description: |-
        Verifies the owner's identity using the claims in the provided Authorization token.

        Returns `204 No Content` if valid, or `401 Unauthorized` otherwise.
      operationId: post-owners-validate
      parameters:
        - in: header
          name: Authorization
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Validate owner
  /projects/:
    get:
      description: |-
        Retrieve a list of projects in the current academic year.
        Authenticated users can access:
        - Their own projects (any status).
        - Other users' projects that are not in draft status.

        Projects from a previous academic year are not returned.

        Supports sorting, filtering, searching, and pagination:
        - 'sort' query param: field to sort by. Prefix with '-' for descending order.
        - 'filter' query param: comma-separated list of statuses to filter.
        - 'search' query param: searches 'title' and 'custom_id', matching if input is contained in either field.
        - Pagination params: 'limit' and 'offset'.
      operationId: get-projects
      parameters:
        - in: header
          name: Authorization
          schema:
            type: string
        - description: Number of items to skip, used for pagination
          explode: false
          in: query
          name: offset
          schema:
            description: Number of items to skip, used for pagination
            format: int64
            type: integer
        - description: Maximum number of items to return
          explode: false
          in: query
          name: limit
          required: true
          schema:
            description: Maximum number of items to return
            format: int64
            type: integer
        - description: Search term applied to 'title' or 'custom_id'
          explode: false
          in: query
          name: search
          schema:
            description: Search term applied to 'title' or 'custom_id'
            type: string
        - description: Sort field (custom_id,title,status,org,created_at,updated_at,updated_by), prefix with '-' for descending
          explode: false
          in: query
          name: sort
          schema:
            description: Sort field (custom_id,title,status,org,created_at,updated_at,updated_by), prefix with '-' for descending
            type: string
        - description: Comma-separated statuses to filter on
          example: pending,draft,fixing
          explode: false
          in: query
          name: status
          schema:
            description: Comma-separated statuses to filter on
            examples:
              - pending,draft,fixing
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListProjectsResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List projects
    post:
      description: Create a new project. Only 'draft' or 'pending' status is allowed on creation.
      operationId: post-projects
      parameters:
        - in: header
          name: Authorization
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            encoding:
              carbon_detail:
                contentType: text/plain
              custom_id:
                contentType: text/plain
              org:
                contentType: text/plain
              org_detail:
                contentType: text/plain
              owner_fullname:
                contentType: text/plain
              owner_line_id:
                contentType: text/plain
              owner_major:
                contentType: text/plain
              owner_nickname:
                contentType: text/plain
              owner_phone_number:
                contentType: text/plain
              owner_student_id:
                contentType: text/plain
              status:
                contentType: text/plain
              title:
                contentType: text/plain
              transportations_csv_file:
                contentType: application/octet-stream
            schema:
              properties:
                carbon_detail:
                  description: CarbonDetail encoded as JSON
                  type: string
                custom_id:
                  type: string
                org:
                  type: string
                org_detail:
                  type: string
                owner_fullname:
                  type: string
                owner_line_id:
                  type: string
                owner_major:
                  type: string
                owner_nickname:
                  type: string
                owner_phone_number:
                  type: string
                owner_student_id:
                  type: string
                status:
                  type: string
                title:
                  type: string
                transportations_csv_file:
                  contentEncoding: binary
                  contentMediaType: application/octet-stream
                  description: This is optional
                  format: binary
                  type: string
              type: object
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateProjectResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create project
  /projects/:id:
    delete:
      description: |-
        Delete a project.
        - Users can delete owned project.
        - Admins can delete everyone's project.
        - Projects from a previous academic year are not accessible.
      operationId: delete-projects-id
      parameters:
        - in: header
          name: Authorization
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete project
    get:
      description: |-
        Retrieve a specific project in the current academic year.
        Authenticated users can access their own projects (any status), or other users' projects that are not in draft status.
        Projects from a previous academic year are not accessible.
      operationId: get-projects-id
      parameters:
        - in: header
          name: Authorization
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
        - explode: false
          in: query
          name: include_transportations
          schema:
            type: boolean
        - explode: false
          in: query
          name: include_review
          schema:
            type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
